<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../shared/ui.css"><title>Thuật ngữ dễ hiểu · Lời giảng Lão Pháp Sư Tịnh Không</title>
<style>.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:18px 0}.g button{padding:14px;border-radius:16px;font-size:1em;text-align:left}.g button.on{background:var(--lotus2);border-color:var(--lotus)}.t{font-family:"Noto Serif",serif;line-height:1.75}</style></head><body>
<main><h1>📘 Thuật ngữ dễ hiểu</h1><p class="sub">Gặp chữ khó như "nhất tâm bất loạn", "đới nghiệp vãng sanh" hay "hồi hướng"? Chọn một chữ để đọc những đoạn Lão Pháp Sư Tịnh Không giảng về chính chữ đó, nguyên văn.</p>
<div class="g" id="g"></div><div id="r"></div><p class="sub" style="font-size:.85em">Các đoạn được máy chọn tự động theo ý nghĩa. Nên đọc cả tập để hiểu trọn ý thầy.</p></main>
<script src="../shared/ui.js"></script><script>
let H,T;Promise.all([fetch('tn.json').then(r=>r.json()),fetch('../shared/quotes.json').then(r=>r.json())]).then(([h,q])=>{H=h;T=q.titles;
$('#g').innerHTML=H.map((x,i)=>'<button onclick="show('+i+')" id="b'+i+'">'+x.i+' '+esc(x.t)+'</button>').join('');show(+(location.hash.slice(1)||0))});
function show(i){document.querySelectorAll('.g button').forEach(b=>b.classList.remove('on'));$('#b'+i).classList.add('on');history.replaceState(0,'','#'+i);const x=H[i];
$('#r').innerHTML='<h2 style="font-family:Noto Serif,serif">'+x.i+' '+esc(x.t)+'</h2>'+x.r.map(([k,n,t,y])=>{const src='Tập '+n+(T[n]?' · '+T[n]:'');return '<div class="card"><div class="meta">'+(k=='q'?'⭐ Trích dẫn quan trọng':'📚 Đoạn giảng')+' · '+esc(src)+'</div><div class="t">'+esc(t)+'</div><div class="acts">'+(y?'<a class="btn pri" target="_blank" href="'+y+'">▶ Nghe đoạn này</a>':'')+'<a class="btn" href="'+KV+'#/tap/'+n+'/td">📖 Đọc tập '+n+'</a>'+markBtn('hc:'+n+':'+t.slice(0,40),{type:'Đoạn giảng',text:t,src,link:KV+'#/tap/'+n+'/td',yt:y})+'</div></div>'}).join('')}
</script></body></html>
