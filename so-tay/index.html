<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../shared/ui.css"><title>Sổ tay cá nhân · Đại Thừa Tịnh Độ</title>
<style>.t{font-family:"Noto Serif",serif;font-size:1.02em;white-space:pre-wrap}textarea{min-height:70px;margin-top:8px;font-size:.92em}.tag{font-size:.75em;background:var(--lotus2);border-radius:999px;padding:2px 8px}</style></head><body>
<main><h1>📒 Sổ tay cá nhân</h1><p class="sub">Những câu kinh và trích dẫn anh chị đã lưu khi học, kèm ghi chú riêng. Sổ tay lưu ngay trên máy này nên không cần tài khoản. Muốn chuyển sang máy khác hoặc sang LotusDharma thì xuất ra tệp.</p>
<div class="acts"><button onclick="ex('json')">⬇ Xuất tệp sao lưu (.json)</button><button onclick="ex('md')">⬇ Xuất để đọc (.md)</button><label class="btn">⬆ Nhập từ tệp<input type="file" accept=".json" hidden onchange="im(this)"></label></div>
<input id="s" type="search" placeholder="Tìm trong sổ tay…" style="margin-top:14px"><div class="chips" id="f"></div><div id="out"></div></main>
<script src="../shared/ui.js"></script><script>
let F='';
function draw(){const o=Notes.all(),v=$('#s').value.toLowerCase(),L=Object.entries(o).sort((a,b)=>b[1].at.localeCompare(a[1].at));const ty=[...new Set(L.map(x=>x[1].type))];
 $('#f').innerHTML=['',...ty].map(t=>`<button class="chip ${F==t?'on':''}" onclick="F='${t}';draw()">${t||'Tất cả'} (${t?L.filter(x=>x[1].type==t).length:L.length})</button>`).join('');
 const R=L.filter(([k,x])=>(!F||x.type==F)&&(!v||(x.text+' '+x.note+' '+x.src).toLowerCase().includes(v)));
 $('#out').innerHTML=R.map(([k,x])=>`<div class="card"><div class="meta"><span class="tag">${esc(x.type)}</span>${esc(x.src)} · lưu ${new Date(x.at).toLocaleDateString('vi-VN')}</div><div class="t">${esc(x.text)}</div><textarea placeholder="Ghi chú của anh chị…" oninput="Notes.set('${k}','note',this.value)">${esc(x.note)}</textarea><div class="acts"><a class="btn" href="${esc(x.link)}">📖 Mở nguồn</a>${x.yt?`<a class="btn" target="_blank" href="${esc(x.yt)}">▶ Nghe đoạn giảng</a>`:''}<button onclick="if(confirm('Xóa mục này khỏi sổ tay?')){const o=Notes.all();delete o['${k}'];Notes.save(o);draw()}">🗑 Xóa</button></div></div>`).join('')||`<div class="empty">${L.length?'Không có mục phù hợp.':'Sổ tay đang trống. Khi đọc ở trang <a href="../tra-cuu/">Tra cứu</a> hoặc <a href="../tung-kinh/">Tụng kinh</a>, bấm “☆ Lưu sổ tay” để lưu câu mình thích.'}</div>`}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function ex(f){const o=Notes.all(),d=new Date().toISOString().slice(0,10);if(f=='json')return dl('so-tay-tinh-do-'+d+'.json',JSON.stringify({app:'DaiThuaTinhDo',version:1,exportedAt:new Date().toISOString(),notes:o},null,1),'application/json');
 dl('so-tay-tinh-do-'+d+'.md','# Sổ tay Tịnh Độ\n\n'+Object.values(o).map(x=>'## '+x.src+' ('+x.type+')\n\n> '+x.text.replace(/\n/g,'\n> ')+(x.note?'\n\nGhi chú: '+x.note:'')).join('\n\n---\n\n'),'text/markdown')}
function im(inp){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),o=Notes.all();let n=0;for(const[k,x]of Object.entries(j.notes||{}))if(!o[k]){o[k]=x;n++}Notes.save(o);toast('Đã nhập '+n+' mục mới');draw()}catch(e){toast('Tệp không hợp lệ')}};r.readAsText(inp.files[0])}
$('#s').oninput=draw;draw();
</script></body></html>
