<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../shared/ui.css"><title>Tra cứu theo chủ đề · 374 tập Kinh Vô Lượng Thọ</title>
<style>.big{font-size:1.05em}.q{font-family:"Noto Serif",serif;font-size:1.02em}.sn{font-size:.95em}.cnt{color:var(--mute);font-size:.86em;margin:8px 2px}.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);width:0;transition:.2s}#ac{position:absolute;left:0;right:0;top:100%;z-index:9;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);margin-top:4px;overflow:hidden;display:none}#ac div{padding:9px 14px;cursor:pointer;font-size:.95em}#ac div.on,#ac div:hover{background:var(--lotus2)}#ac small{color:var(--mute);float:right}#dym a{color:var(--lotus);cursor:pointer;font-weight:600}select.btn{appearance:auto}</style></head><body>
<main><h1>🔎 Tra cứu theo chủ đề</h1><p class="sub">Hỏi bằng câu tự nhiên, như "tại sao phải đoạn tham sân si" hay "bận rộn thì niệm Phật thế nào". Trang sẽ tìm trong 374 tập các đoạn nguyên văn lời giảng của Lão Pháp Sư Tịnh Không nói về ý đó, đoạn sát nhất ở trên cùng.</p>
<div style="position:relative"><input id="s" type="search" class="big" autocomplete="off" placeholder="Hỏi một câu, ví dụ: tại sao phải đoạn tham sân si" autofocus><div id="ac"></div></div><div id="dym" class="cnt"></div>
<div class="chips" id="sug"></div>
<div class="chips"><button class="chip on" data-m="all">Tất cả</button><button class="chip" data-m="q">⭐ Chỉ trích dẫn quan trọng</button><button class="chip" data-m="f">📚 Chỉ toàn văn</button><select id="fp" class="btn"><option value="">Mọi phẩm</option></select><label class="btn"><input type="checkbox" id="fv"> Chỉ đoạn có video</label></div>
<div id="prog" style="display:none"><div class="bar"><i id="pb"></i></div><div class="cnt" id="pt"></div></div>
<div class="cnt" id="cnt"></div><div id="out"></div></main>
<script src="../shared/ui.js"></script><script>
const SUG=['tại sao phải đoạn tham sân si','bận rộn thì niệm Phật thế nào','vọng niệm nhiều phải làm sao','hồi hướng như thế nào','thế nào là buông xả','làm sao giữ tâm thanh tịnh','điều kiện vãng sanh','đối xử với người khác'];
$('#sug').innerHTML=SUG.map(s=>'<button data-s="'+s+'">'+s+'</button>').join('');
const STOP=new Set('tại sao vì làm thế nào nào gì là có không được những các của và thì mà cho với ở trong để một này đó nên hay hỏi cần phải lại chúng ta tôi bạn mình họ ra vào đến từ khi lúc rằng như vậy thế ấy đây kia rất cũng đã đang sẽ còn chỉ đều nhưng hoặc hãy xin ạ ơi nhé à ư chứ muốn biết giúp em anh chị'.split(' '));[...STOP].forEach(w=>STOP.add(w.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d')));
const strip=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
const SYN={sinh:'sanh'};
const PSYN=[['nóng giận','sân'],['giận dữ','sân'],['tức giận','sân'],['giận','sân'],['ham muốn','tham'],['tham lam','tham'],['ngu si','si'],['si mê','si'],['ngu muội','si'],['về tây phương','vãng sanh'],['về cõi phật','vãng sanh'],['tây phương','cực lạc'],['cực lạc','tây phương'],['vọng niệm','vọng tưởng'],['vọng tưởng','vọng niệm'],['tạp niệm','vọng niệm'],['suy nghĩ lung tung','vọng tưởng'],['buông bỏ','buông xả'],['buông xả','buông bỏ'],['chết','lâm chung'],['qua đời','lâm chung'],['lúc mất','lâm chung'],['mạng chung','lâm chung'],['trí huệ','trí tuệ'],['phước đức','công đức'],['ăn năn','sám hối'],['lỗi lầm','sám hối'],['đau khổ','khổ'],['lo lắng','phiền não'],['buồn phiền','phiền não'],['bực bội','phiền não'],['cha mẹ','hiếu'],['hiếu thảo','hiếu'],['giết hại','sát sanh'],['sát sinh','sát sanh'],['ăn chay','ăn chay'],['bận rộn','công việc'],['tập trung','nhất tâm'],['chuyên tâm','nhất tâm'],['đời sau','đời sau'],['niềm tin','tín tâm'],['tin tưởng','tín tâm'],['ước nguyện','nguyện'],['phát nguyện','nguyện'],['tu tập','tu hành'],['tu học','tu hành'],['kinh sách','kinh điển'],['thầy','thiện tri thức'],['bệnh tật','bệnh'],['ganh tị','đố kỵ'],['ghen tị','đố kỵ'],['ích kỷ','tự tư tự lợi'],['tiền bạc','tài']];
const tok=(s,flat)=>{s=s.toLowerCase();if(flat)s=strip(s);return s.split(/[^\p{L}\p{N}]+/u).filter(Boolean).map(w=>SYN[w]||w)};
let QD=null,FT=null,DOCS=[],IDX={},mode='all';
fetch('../shared/quotes.json').then(r=>r.json()).then(j=>{QD=j;j.q.forEach((q,i)=>DOCS.push({k:'q',n:q[0],t:q[2],g:q[1],y:q[3]}));for(const n in j.titles){const m=/^Phẩm (\d+)/.exec(j.titles[n]);if(m)PH[n]=m[1]}const ps=[...new Set(Object.values(PH))].sort((a,b)=>a-b);$('#fp').innerHTML+=ps.map(p=>{const t=Object.entries(j.titles).find(([n,x])=>PH[n]==p)[1];return '<option value="'+p+'">'+esc(t.split(' — ')[0])+'</option>'}).join('');
 const u=new URLSearchParams(location.search).get('q');if(u)$('#s').value=u;run();loadFT()});
let DYM=null,PH={};
function ed(a,b){if(a==b)return 0;const m=a.length,n=b.length;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]==b[j-1]?0:1));p=c}return p[n]}
function tt(n){return 'Tập '+n+(QD.titles[n]?' · '+QD.titles[n]:'')}
function build(flat){const inv=new Map(),len=[];let tot=0;DOCS.forEach((d,i)=>{const w=tok(d.t,flat);len[i]=w.length;tot+=w.length;const tf=new Map();for(const x of w)tf.set(x,(tf.get(x)||0)+1);for(const [x,c] of tf){let a=inv.get(x);if(!a)inv.set(x,a=[]);a.push(i,c)}});return {inv,len,avg:tot/DOCS.length,N:DOCS.length,flat}}
function index(flat){const key=(flat?'f':'a')+DOCS.length;return IDX[key]||(IDX={},IDX[key]=build(flat))}
function search(v){const ws=v.toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(Boolean),flat=ws.filter(w=>strip(w)==w).length*2>ws.length;const all=tok(v,flat),terms=[...new Set(all.filter(w=>!STOP.has(w)&&w.length>1||/^\d+$/.test(w)))];if(!terms.length)terms.push(...new Set(all));
 const vl=' '+v.toLowerCase()+' ',ext=[];for(const [a,b] of PSYN)if(vl.includes(' '+a+' ')||(a.indexOf(' ')<0&&vl.includes(' '+a)))for(const w of tok(b,flat))if(!terms.includes(w)&&!STOP.has(w))ext.push(w);
 const I=index(flat),sc=new Map(),hit=new Map();
 const W=new Map(terms.map(t=>[t,1]));for(const t of ext)if(!W.has(t))W.set(t,.9);
 DYM=null;const fix=terms.map(t=>{if(I.inv.has(t)||t.length<3)return t;let best=null,bd=0;const st=strip(t);for(const [x,a] of I.inv){if(a.length<6||Math.abs(x.length-t.length)>1)continue;const d=ed(strip(x),st);if(d<=1&&a.length>bd){bd=a.length;best=x}}return best||t});
 if(fix.join(' ')!=terms.join(' ')){let o=v;terms.forEach((t,i)=>{if(fix[i]!=t)o=o.replace(new RegExp('(^|[^\\p{L}])'+t+'(?=[^\\p{L}]|$)','iu'),'$1'+fix[i])});DYM=o;fix.forEach(t=>{if(!W.has(t))W.set(t,.9)})}
 for(const [t,wt] of W){const a=I.inv.get(t);if(!a)continue;const df=a.length/2,idf=wt*Math.log(1+(I.N-df+.5)/(df+.5));for(let k=0;k<a.length;k+=2){const i=a[k],c=a[k+1],s=idf*c*2.2/(c+1.2*(.25+.75*I.len[i]/I.avg));sc.set(i,(sc.get(i)||0)+s);hit.set(i,(hit.get(i)||0)+1)}}
 const nT=Math.max(1,terms.filter(t=>I.inv.has(t)).length+(DYM?1:0)),cov=t=>nT>1?Math.pow(Math.min(1,t/nT),1.5):1;
 let R=[...sc].map(([i,s])=>[i,s*cov(hit.get(i))]).sort((x,y)=>y[1]-x[1]).slice(0,600);
 const kept=[...W.keys()].filter(t=>I.inv.has(t)),bi=[];for(let k=0;k+1<all.length;k++)if(!STOP.has(all[k])||!STOP.has(all[k+1]))bi.push(all[k]+' '+all[k+1]);
 R=R.map(([i,s])=>{const d=DOCS[i],w=' '+tok(d.t,flat).join(' ')+' ';let b=0;for(const p of bi)if(w.includes(' '+p+' '))b+=1.5;const ph=' '+kept.join(' ')+' ';if(kept.length>1&&w.includes(ph))b+=3;if(d.k=='q')b+=1;return [i,s+b]}).sort((x,y)=>y[1]-x[1]);
 if(mode!='all')R=R.filter(([i])=>DOCS[i].k==mode);const fp=$('#fp').value,fv=$('#fv').checked;if(fp)R=R.filter(([i])=>PH[DOCS[i].n]==fp);if(fv)R=R.filter(([i])=>DOCS[i].y);
 return {R,terms:kept,flat}}
function hl(t,terms,flat){const set=new Set(terms);return t.split(/([\p{L}\p{N}]+)/u).map(w=>{let x=w.toLowerCase();if(flat)x=strip(x);x=SYN[x]||x;return set.has(x)?'<mark>'+esc(w)+'</mark>':esc(w)}).join('')}
function snip(t,terms,flat){if(t.length<480)return t;const W=t.split(/(?<=[.!?;:])\s+/);let best=0,bs=-1;const set=new Set(terms);W.forEach((s,i)=>{const n=tok(s+' '+(W[i+1]||''),flat).filter(w=>set.has(w)).length;if(n>bs){bs=n;best=i}});let a=Math.max(0,best-1),o=W.slice(a,a+4).join(' ');return (a?'… ':'')+o+(a+4<W.length?' …':'')}
function run(){const v=$('#s').value.trim();history.replaceState(0,'',v?'?q='+encodeURIComponent(v):location.pathname);
 if(!v){$('#cnt').textContent='';$('#out').innerHTML='<div class="empty">Gõ một câu hỏi hay một chủ đề, ví dụ "tại sao phải đoạn tham sân si". Trang sẽ tìm các đoạn giảng nói về ý đó, đoạn liên quan nhất ở trên cùng.</div>';return}
 const {R,terms,flat}=search(v);
 $('#dym').innerHTML=DYM?'Có phải ý anh chị là: <a id="dyma">'+esc(DYM)+'</a>?':'';$('#cnt').innerHTML=(R.length?'Tìm thấy '+R.length+' đoạn liên quan, xếp theo mức độ sát với câu hỏi':'Chưa tìm thấy')+(terms.length?' · ý chính: '+terms.map(t=>'<mark>'+esc(t)+'</mark>').join(' '):'')+(FT?'':' · <i>đang nạp thêm toàn văn 374 tập…</i>');
 $('#out').innerHTML=R.slice(0,60).map(([i])=>{const d=DOCS[i],q=d.k=='q';return '<div class="card"><div class="meta">'+(q?'⭐ Trích dẫn quan trọng · ':'📚 Đoạn giảng · ')+esc(tt(d.n))+(q?' · '+esc(d.g):'')+'</div><div class="'+(q?'q':'sn')+'">'+hl(q?d.t:snip(d.t,terms,flat),terms,flat)+'</div><div class="acts">'+(d.y?'<a class="btn pri" target="_blank" href="'+d.y+'">▶ Nghe đúng đoạn giảng</a>':'')+'<a class="btn" href="'+KV+'#/tap/'+d.n+(q?'/td':'')+'">📖 Mở tập '+d.n+'</a>'+markBtn((q?'q:':'f:')+d.n+':'+d.t.slice(0,40),{type:q?'Trích dẫn':'Đoạn giảng',text:d.t,src:tt(d.n),link:KV+'#/tap/'+d.n+(q?'/td':''),yt:d.y})+'</div></div>'}).join('')||'<div class="empty">Anh chị thử diễn đạt khác, hoặc dùng ít chữ hơn.</div>'}
async function loadFT(){$('#prog').style.display='';const out=new Array(374);let done=0;
 const one=async n=>{const t=await (await fetch(KV+'data/tap'+String(n).padStart(3,'0')+'.js')).text();const j=JSON.parse(t.slice(t.indexOf(',')+1,t.lastIndexOf(')')));out[n-1]=j.blocks.filter(b=>b.p&&b.p.length>60).map(b=>({k:'f',n,t:b.p}));done++;$('#pb').style.width=done/3.74+'%';$('#pt').textContent='Đang nạp toàn văn: '+done+'/374 tập'};
 const ns=[...Array(374).keys()].map(i=>i+1);await Promise.all([...Array(8)].map(async()=>{while(ns.length)await one(ns.shift())}));
 out.forEach(a=>DOCS.push(...a));FT=1;IDX={};$('#prog').style.display='none';run()}
let PHR=null,acI=-1;fetch('phrases.json').then(r=>r.json()).then(j=>{PHR=[...j.q.map(q=>[q,1e9]),...j.p].map(([p,c])=>[p,c,strip(p.toLowerCase())])});
function ac(){const v=$('#s').value,box=$('#ac');if(!PHR||v.trim().length<2){box.style.display='none';return}
 const raw=v.replace(/\s+$/,''),base=raw.replace(/\S+$/,''),pw=strip(base.toLowerCase()).trim().split(/\s+/).filter(Boolean),last=strip(raw.toLowerCase()).split(/\s+/).pop();
 const L=[];for(const [p,c,f] of PHR){if(c>=1e9){if(f.includes(strip(raw.toLowerCase())))L.push([p,c+1,p,1]);continue}const fw=f.split(' ');const k=fw.findIndex(w=>w.startsWith(last));if(k<0)continue;let ok=1;for(let i=1;i<=k;i++)if(pw[pw.length-i]!==fw[k-i]){ok=0;break}if(!ok||(pw.length&&!k&&!0))continue;const bw=base.trim().split(/\s+/).filter(Boolean);L.push([p,c,(bw.slice(0,bw.length-k).join(' ')+' '+p).trim(),0])}
 L.sort((a,b)=>b[1]-a[1]);const seen=new Set(),O=L.filter(x=>!seen.has(x[2])&&seen.add(x[2])).slice(0,8);
 box.innerHTML=O.map(([p,c,o,q])=>'<div data-ac="'+esc(o)+'">'+esc(o)+'<small>'+(q?'câu hỏi thường gặp':'phổ biến')+'</small></div>').join('');acI=-1;box.style.display=O.length?'':'none'}
let tm;$('#s').oninput=()=>{ac();clearTimeout(tm);tm=setTimeout(run,350)};
$('#s').onkeydown=e=>{const it=[...document.querySelectorAll('#ac div')];if(e.key=='ArrowDown'||e.key=='ArrowUp'){e.preventDefault();acI=(acI+(e.key=='ArrowDown'?1:-1)+it.length)%it.length;it.forEach((x,i)=>x.classList.toggle('on',i==acI))}else if(e.key=='Enter'){if(acI>=0&&it[acI]){$('#s').value=it[acI].dataset.ac}$('#ac').style.display='none';run()}else if(e.key=='Escape')$('#ac').style.display='none'};
$('#s').onblur=()=>setTimeout(()=>$('#ac').style.display='none',150);$('#fp').onchange=run;$('#fv').onchange=run;
document.addEventListener('click',e=>{const a=e.target.closest('[data-ac]');if(a){$('#s').value=a.dataset.ac;$('#ac').style.display='none';run()}if(e.target.id=='dyma'){$('#s').value=DYM;run()}const s=e.target.closest('[data-s]');if(s){$('#s').value=s.dataset.s;run()}const m=e.target.closest('[data-m]');if(m){mode=m.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x==m));run()}});
</script></body></html>
