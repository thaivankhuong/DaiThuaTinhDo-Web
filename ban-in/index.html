<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../shared/ui.css"><title>Bản in theo phẩm · Kinh Vô Lượng Thọ</title>
<style>.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}.pg h2{font-family:"Noto Serif",serif;text-align:center;margin:26px 0 12px}.pg p{font-family:"Noto Serif",serif;line-height:1.9;font-size:var(--fs,1.15em);margin:0 0 .7em}
@media print{header,nav,.bar,.sub,h1,.toast{display:none!important}body{background:#fff!important;color:#000!important}main{max-width:none;padding:0}.pg h2{page-break-before:always}.pg h2:first-child{page-break-before:auto}.pg p{font-size:var(--fs,15pt)}}</style></head><body>
<main><h1>🖨️ Bản in theo phẩm</h1><p class="sub">Chọn phẩm, chọn cỡ chữ rồi bấm In. Trình duyệt sẽ cho in ra giấy hoặc lưu thành PDF. Kinh văn: bản hội tập của Ngài Hạ Liên Cư, bản dịch Việt của Thích Đức Niệm và Cư sĩ Minh Chánh (nguồn Lăng Nghiêm Tự).</p>
<div class="bar"><select id="a"></select> đến <select id="z"></select><select id="f"><option value="1.05em">Chữ vừa</option><option value="1.3em" selected>Chữ to</option><option value="1.6em">Chữ rất to</option></select><button class="pri" onclick="print()">🖨️ In hoặc lưu PDF</button></div><div class="pg" id="p"></div></main>
<script src="../shared/ui.js"></script><script>
let K;fetch('../shared/kinh.json').then(r=>r.json()).then(k=>{K=k.pham;const o=K.map((p,i)=>'<option value="'+i+'">'+(p.n?'Phẩm '+p.n+': ':'')+esc(p.ten)+'</option>').join('');$('#a').innerHTML=o;$('#z').innerHTML=o;$('#a').value=1;$('#z').value=1;['a','z','f'].forEach(x=>$('#'+x).onchange=draw);draw()});
function draw(){let a=+$('#a').value,z=+$('#z').value;if(z<a){z=a;$('#z').value=a}document.documentElement.style.setProperty('--fs',$('#f').value);
$('#p').innerHTML=K.slice(a,z+1).map(p=>'<h2>'+(p.n?'Phẩm '+p.n+'<br>':'')+esc(p.ten)+'</h2>'+p.rows.map(r=>r.vi?'<p>'+esc(r.vi).replace(/\n/g,'<br>')+'</p>':'').join('')).join('')}
</script></body></html>
