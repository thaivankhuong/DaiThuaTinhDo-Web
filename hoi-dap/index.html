<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../shared/ui.css"><title>Hỏi đáp Tịnh Độ · Trả lời bằng lời giảng nguyên văn</title>
<style>details.card{padding:0}summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;gap:10px}summary:after{content:"＋";margin-left:auto;color:var(--gold)}details[open] summary:after{content:"－"}
.ans{padding:0 16px 14px}.a{border-left:3px solid var(--lotus);padding:6px 12px;margin:10px 0;font-family:"Noto Serif",serif}</style></head><body>
<main><h1>❓ Hỏi đáp Tịnh Độ</h1><p class="sub">Những câu người mới hay hỏi. Mỗi câu được trả lời bằng các đoạn nguyên văn lời giảng của Lão Pháp Sư Tịnh Không, ghi rõ tập và có nút nghe đúng đoạn trong video gốc. Không có lời diễn giải nào thêm vào.</p>
<form id="ask" class="acts" style="flex-wrap:nowrap"><input id="s" type="search" placeholder="Câu hỏi khác? Gõ chủ đề, ví dụ: hộ niệm, sám hối…"><button class="pri">Tìm</button></form>
<div id="out" style="margin-top:12px"></div></main>
<script src="../shared/ui.js"></script><script>
$('#ask').onsubmit=e=>{e.preventDefault();location.href='../tra-cuu/?q='+encodeURIComponent($('#s').value)};
Promise.all([fetch('qa.json').then(r=>r.json()),fetch('../shared/quotes.json').then(r=>r.json())]).then(([Q,D])=>{
 $('#out').innerHTML=Q.map((x,k)=>`<details class="card" id="c${k}"><summary>${esc(x.q)}</summary><div class="ans">${x.a.map(i=>{const [n,g,t,y]=D.q[i],src='Tập '+n+(D.titles[n]?' · '+D.titles[n]:'');return `<div class="a">${esc(t)}</div><div class="meta">Lão Pháp Sư Tịnh Không · ${esc(src)}</div><div class="acts">${y?`<a class="btn pri" target="_blank" href="${y}">▶ Nghe đúng đoạn giảng</a>`:''}<a class="btn" href="${KV}#/tap/${n}/td">📖 Đọc cả tập ${n}</a>${markBtn('q:'+n+':'+t.slice(0,40),{type:'Trích dẫn',text:t,src,link:KV+'#/tap/'+n+'/td',yt:y})}</div>`}).join('')}<div class="acts" style="margin-top:12px"><a class="btn" href="../tra-cuu/?q=${encodeURIComponent(x.kw[0])}">🔎 Xem thêm các đoạn về "${esc(x.kw[0])}"</a></div></div></details>`).join('');
 const h=location.hash.slice(1);if(h&&$('#'+h)){$('#'+h).open=true;$('#'+h).scrollIntoView()}});
</script></body></html>
